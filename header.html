<!-- Site Header -->
<style>
    .site-header {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: rgba(13, 20, 36, 0.96);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        font-family: 'Ysabeau', sans-serif;
        transition: box-shadow 0.3s ease;
    }
    .site-header.scrolled {
        box-shadow: 0 4px 32px rgba(0,0,0,0.4);
    }

    .header-inner {
        max-width: 1300px;
        margin: 0 auto;
        padding: 0 48px;
        height: 74px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
    }

    /* Logo */
    .header-logo {
        display: flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
        flex-shrink: 0;
    }
    .header-logo-icon {
        width: 44px;
        height: 44px;
        position: relative;
        flex-shrink: 0;
    }
    .header-logo-name {
        color: #f1f5f9;
        font-size: 1.4rem;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.01em;
        white-space: nowrap;
    }
    .header-logo-name span {
        color: #4A90E2;
        font-weight: 400;
    }

    /* Nav */
    .header-nav {
        display: flex;
        align-items: center;
        gap: 2px;
        flex: 1;
        justify-content: center;
    }
    .header-nav a {
        color: rgba(255,255,255,0.6);
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 500;
        padding: 8px 14px;
        border-radius: 7px;
        transition: color 0.2s, background 0.2s;
        letter-spacing: 0.01em;
        white-space: nowrap;
    }
    .header-nav a:hover {
        color: #f1f5f9;
        background: rgba(255,255,255,0.07);
    }
    .header-nav a.active {
        color: #4A90E2;
        background: rgba(74,144,226,0.12);
    }

    /* Mobile toggle */
    .mobile-toggle {
        display: none;
        background: none;
        border: none;
        cursor: pointer;
        color: rgba(255,255,255,0.7);
        padding: 6px;
        border-radius: 6px;
        transition: background 0.2s;
        flex-shrink: 0;
    }
    .mobile-toggle:hover { background: rgba(255,255,255,0.08); }
    .mobile-toggle .bar {
        display: block;
        width: 22px;
        height: 2px;
        background: currentColor;
        border-radius: 2px;
        transition: transform 0.25s, opacity 0.25s;
        margin: 5px 0;
    }
    .mobile-toggle.open .bar:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .mobile-toggle.open .bar:nth-child(2) { opacity: 0; }
    .mobile-toggle.open .bar:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* Mobile menu */
    .mobile-menu {
        display: none;
        background: #0d1424;
        border-top: 1px solid rgba(255,255,255,0.05);
        padding: 12px 20px 20px;
        animation: slideDown 0.2s ease;
    }
    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-8px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .mobile-menu.open { display: block; }
    .mobile-menu a {
        display: block;
        color: rgba(255,255,255,0.65);
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 500;
        padding: 11px 16px;
        border-radius: 8px;
        transition: all 0.2s;
        margin-bottom: 2px;
    }
    .mobile-menu a:hover, .mobile-menu a.active {
        color: #f1f5f9;
        background: rgba(255,255,255,0.07);
    }
    .mobile-menu a.active { color: #4A90E2; }

    @media (max-width: 900px) {
        .header-inner { padding: 0 24px; }
        .header-nav { gap: 0; }
        .header-nav a { padding: 7px 10px; font-size: 0.82rem; }
    }

    @media (max-width: 768px) {
        .header-nav { display: none; }
        .mobile-toggle { display: flex; flex-direction: column; }
        .header-inner { padding: 0 20px; }
    }
</style>

<header class="site-header" id="siteHeader">
    <div class="header-inner">

        <!-- Logo -->
        <a href="index.html" class="header-logo">
            <div class="header-logo-name">
                Maddu Lab<br>
                <span>@ Hopkins</span>
            </div>
        </a>

        <!-- Desktop Nav -->
        <nav class="header-nav" id="desktopNav">
            <a href="index.html">Home</a>
            <a href="research.html">Research</a>
            <a href="publications.html">Publications</a>
            <a href="people.html">People</a>
            <a href="teaching.html">Teaching</a>
            <a href="software.html">Software</a>
        </nav>

        <!-- Mobile toggle -->
        <button class="mobile-toggle" id="mobileToggle" onclick="toggleMobileMenu()" aria-label="Toggle menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </div>

    <!-- Mobile menu -->
    <div class="mobile-menu" id="mobileNav">
        <a href="index.html">Home</a>
        <a href="research.html">Research</a>
        <a href="publications.html">Publications</a>
        <a href="people.html">People</a>
        <a href="teaching.html">Teaching</a>
        <a href="software.html">Software</a>
    </div>
</header>

<script>
    function toggleMobileMenu() {
        const menu = document.getElementById('mobileNav');
        const toggle = document.getElementById('mobileToggle');
        const isOpen = menu.classList.contains('open');
        menu.classList.toggle('open', !isOpen);
        toggle.classList.toggle('open', !isOpen);
    }

    document.addEventListener('click', function(e) {
        const menu = document.getElementById('mobileNav');
        const toggle = document.getElementById('mobileToggle');
        if (menu && toggle && !menu.contains(e.target) && !toggle.contains(e.target)) {
            menu.classList.remove('open');
            toggle.classList.remove('open');
        }
    });

    // Shadow on scroll
    window.addEventListener('scroll', function() {
        document.getElementById('siteHeader').classList.toggle('scrolled', window.scrollY > 10);
    });

    // Highlight active page
    document.addEventListener('DOMContentLoaded', function() {
        const page = location.pathname.split('/').pop() || 'index.html';
        document.querySelectorAll('.header-nav a, .mobile-menu a').forEach(function(link) {
            if (link.getAttribute('href') === page) link.classList.add('active');
        });
    });
</script>
