<!-- Common Footer Component -->
<style>
    /* Force social icons to always be visible */
    .footer-col .social-links,
    .footer-col .social-links a {
        display: flex !important;
        visibility: visible !important;
        opacity: 1 !important;
    }
    
    /* Hide footer social on desktop (now in header) */
    .footer-social {
        display: none !important;
    }
    
    /* Show footer social on mobile */
    @media (max-width: 768px) {
        .footer-social {
            display: block !important;
        }
    }
    
    /* Desktop: Ensure footer-container is visible */
    @media (min-width: 769px) {
        .footer-container {
            display: flex !important;
        }
        .mobile-footer-layout {
            display: none !important;
        }
    }
    
    @media (max-width: 768px) {
        .footer {
            padding: 30px 0 !important;
        }
        .footer-container {
            flex-direction: column !important;
            align-items: center !important;
            gap: 25px !important;
        }
        .footer-col {
            text-align: center !important;
            padding: 0 !important;
            width: 100% !important;
        }
        .footer-logo {
            flex-direction: column !important;
            order: 1 !important;
        }
        .footer-logo img {
            height: 80px !important;
        }
        .footer-logo div[style*="width: 1px"] {
            display: none !important;
        }
        .footer-contact {
            display: none !important;
        }
        .mobile-footer-layout {
            display: block !important;
        }
        .footer-container {
            display: none !important;
        }
    }
</style>
